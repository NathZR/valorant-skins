<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes armes Valorant</title>
<style>
body{margin:0;background:#0b0e14;color:#fff;font-family:Arial,sans-serif;padding:30px}
h1{margin:0 0 20px;letter-spacing:2px}
#search{width:100%;max-width:400px;padding:12px;border-radius:8px;border:1px solid #2a3140;background:#121722;color:#fff;font-size:15px;margin-bottom:25px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:#121722;border:1px solid #2a3140;border-radius:12px;padding:16px}
.img{height:150px;border-radius:8px;background:#1a2132;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#556}
.img img{max-width:95%;max-height:95%}
.name{font-weight:bold;font-size:17px;margin:14px 0 4px}
.arme{color:#8b93a5;font-size:13px}
.prix{text-align:right;font-weight:bold;margin-top:12px;color:#f5c542}
</style>
</head>
<body>

<h1>MES ARMES VALORANT</h1>
<input id="search" placeholder="Rechercher une arme ou un skin...">
<div id="grid"></div>

<script>
// ============================================
// AJOUTE TES ARMES ICI (une ligne = une case)
// nom = nom du skin | arme = type d'arme
// prix = valeur en VP | image = lien (peut rester vide "")
// ============================================
const armes = [
  { nom: "Reaver Vandal",  arme: "Vandal",   prix: 1775, image: "" },
  { nom: "Prime Phantom",  arme: "Phantom",  prix: 1775, image: "" },
  { nom: "Oni Phantom",    arme: "Phantom",  prix: 1775, image: "" },
  { nom: "Elderflame Operator", arme: "Operator", prix: 2175, image: "" },
  { nom: "Glitchpop Dagger", arme: "Mêlée",  prix: 4350, image: "" },
  { nom: ".EXE Ghost",     arme: "Ghost",    prix: 875,  image: "" },
  { nom: ".SYS Sheriff",   arme: "Sheriff",  prix: 1275, image: "" }
];
// ============================================

const grid = document.getElementById("grid");
const search = document.getElementById("search");

function afficher() {
  const texte = search.value.toLowerCase();
  grid.innerHTML = "";
  armes
    .filter(a => (a.nom + " " + a.arme).toLowerCase().includes(texte))
    .forEach(a => {
      const euros = (a.prix * 0.00999).toFixed(2).replace(".", ",");
      const img = a.image ? '<img src="' + a.image + '" alt="">' : "pas d'image";
      grid.innerHTML +=
        '<div class="card">' +
          '<div class="img">' + img + '</div>' +
          '<div class="name">' + a.nom + '</div>' +
          '<div class="arme">' + a.arme + '</div>' +
          '<div class="prix">' + a.prix + ' VP (≈ ' + euros + ' €)</div>' +
        '</div>';
    });
}

search.addEventListener("input", afficher);
afficher();
</script>

</body>
</html>
