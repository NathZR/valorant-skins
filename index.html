<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valorant Skins</title>
<style>
body{margin:0;background:#0d0b1a;color:#ece8ff;font-family:Arial,sans-serif;padding:30px}
h1{margin:0 0 20px;letter-spacing:2px;color:#8b5cf6}
#search{width:100%;max-width:420px;padding:12px;border-radius:8px;border:1px solid #2d2850;background:#16132b;color:#ece8ff;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{display:flex;align-items:center;gap:8px;background:#16132b;border:1px solid #2d2850;color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:bold;cursor:pointer}
.btn small{color:#9a94c4;font-weight:normal}
.btn img{width:22px;height:22px}
.btn.on{background:#8b5cf6;border-color:#8b5cf6;color:#fff}.btn.on small{color:#ffffffcc}
.btn.rar.on{background:#16132b;color:#fff;border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:22px 0;padding-bottom:12px;border-bottom:1px solid #2d2850;color:#9a94c4;font-size:13px}
select{background:#16132b;color:#fff;border:1px solid #2d2850;border-radius:8px;padding:8px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:#16132b;border:none;border-radius:12px;padding:16px}
.img{position:relative;height:150px;border-radius:8px;background:radial-gradient(circle at 50% 30%,var(--c-fond),#16132b);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#556}
.img img.arme-img{max-width:95%;max-height:95%}
.badge{position:absolute;top:8px;right:8px}
.badge img{width:38px;height:38px;filter:drop-shadow(0 2px 4px #000a)}
.name{font-weight:bold;font-size:17px;margin:14px 0 4px}
.arme{color:#9a94c4;font-size:13px}
.prix{text-align:right;font-weight:bold;margin-top:12px}
.prix small{display:block;color:#9a94c4;font-weight:normal;font-size:11px;margin-top:2px}
#more{display:block;margin:30px auto}
#msg{text-align:center;color:#9a94c4;padding:50px}
.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}
#detail{position:fixed;inset:0;z-index:50;background:#0d0b1a;overflow-y:auto;padding:30px;display:none}
#detail.open{display:block}
.d-wrap{max-width:1000px;margin:0 auto}
#d-close{margin-bottom:20px}
.d-hero{position:relative;height:320px;border-radius:14px;border:1px solid var(--c);box-shadow:0 0 30px -10px var(--c);background:radial-gradient(circle at 50% 30%,var(--c-fond),#16132b);display:flex;align-items:center;justify-content:center;overflow:hidden}
.d-hero img.big{max-width:90%;max-height:90%}
.d-hero .badge img{width:56px;height:56px}
.d-title{font-size:30px;font-weight:bold;margin:22px 0 4px}
.d-sub{color:#9a94c4;font-size:15px}
.d-prix{font-weight:bold;font-size:20px;margin-top:10px}
.d-prix small{color:#9a94c4;font-weight:normal;font-size:13px;margin-left:8px}
.d-h2{margin:34px 0 12px;letter-spacing:2px;font-size:16px;color:#9a94c4}
#d-video{width:100%;max-height:560px;background:#000;border-radius:12px;border:1px solid #2d2850}
#d-tabs{margin:0 0 14px}
#d-novideo{color:#9a94c4;padding:30px 0}
.layout{display:flex;gap:28px;align-items:flex-start}
.side{position:sticky;top:30px;width:220px;flex:none}
.main{flex:1;min-width:0}
.side #search{max-width:none;box-sizing:border-box}
#armesBtns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
#armesBtns .btn{justify-content:space-between}
@media(max-width:760px){.layout{flex-direction:column}.side{position:static;width:100%}#armesBtns{flex-direction:row;flex-wrap:wrap}}
#createur{margin-top:24px;padding-top:18px;border-top:1px solid #ffffff1f}
.c-titre{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin-bottom:12px}
.c-profil{display:flex;align-items:center;gap:12px;font-weight:bold;font-size:16px}
.c-profil img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none}
</style>
</head>

// Prix des skins de mêlée (estimations)
const PRIX_MELEE = { Select: 1750, Deluxe: 2550, Premium: 3550, Exclusive: 4350, Ultra: 4950 };

// Prix réels des couteaux en boutique (clé = nom anglais simplifié : minuscules, sans espaces ni symboles).
// Un couteau absent de cette liste garde le prix standard de sa rareté (PRIX_MELEE).
const PRIX_COUTEAUX = {};
[
  [1750, ["Luxe Knife","Smite Knife","Daydreams Crowbar","Reverie Sword","Intergrade Blade","Storm Maw Axe"]],
  [2550, ["Prism Knife","Altitude Knuckle Knife","Winterwunderland Candy Cane","Caeruleus","Catrina","Chromedek Gauntlet","Emberclad Hammer","Kaimana","Titanmail Mace","MK VII Liberty Combat Knife","Orion Sword","No Limits Bat","Hu Else","Snowfall Wand"]],
  [3550, ["Nebula Knife","Reaver Knife","Xenohunter Knife","Ego Knife","Solarstride Flamethrower","Celestial Fan","Crimsonbeast Hammer","Hack","Spline Dagger","Spline Knife","Minima Karambit","Black.Market Butterfly Knife","Oni Claw","Sovereign Sword","Prime Axe","Prime 2.0 Karambit","Cryostasis Impact Drill","Forsaken Ritual Blade","Soulstrife Scythe","Magepunk Shock Gauntlet","Magepunk Electroblade","Gaia's Wrath","Gaias Fury","Neptune Anchor","Origin Crescent Blade","Prosperity","Radiant Crisis 001 Baseball Bat","Recon Balisong","Valorant Go! Vol. 1 Knife","Ion Energy Sword","Gravitational Uranium Neuroblaster Baton","Reaver EP5 Karambit","Yoru's Stylish Butterfly Comb"]],
  [4350, ["Popmonz Knife","Bolt Knife","Helix Daggers","Doombringer Battleaxe","Singularity Butterfly Knife","Singularity Knife","BlastX Polymer Knifetech Coated Knife","Glitchpop Dagger","Glitchpop Axe","Eternal Sovereign","XERØFANG Knife","Overdrive Blade","Ruyi Staff","Mystbloom Kunai","Mystbloom Fanblade","Divergence Staff","Ion Knife","RGX 11z Pro Blade","RGX 11z Pro Firefly","Blades of Primordia","Blades of Imperium","Neo Frontier Axe","Magepunk Sparkswitch","Terminus a Quo","Blade of Chaos","Blade of the Ruined King","Relic of the Sentinel"]],
  [4550, ["Araxys Bio Harvester"]],
  [4950, ["Elderflame Dagger","Personal Administrative Melee Unit"]],
  [5350, ["Reaver Butterfly Knife","Waveform","E.XO Edge","Onimaru Kunitsuna","Kuronami no Yaiba"]],
  [5950, ["Radiant Entertainment System Arcade Knife","RDS Power Fist","Power Fist"]]
].forEach(([prix, noms]) => noms.forEach(n => PRIX_COUTEAUX[simplifier(n)] = prix));

// Couteaux de passe (secours si l'API des contrats ne répond pas)
const PASS_COUTEAUX = new Set([
  "Sandswept Dagger","Transition Knife","Fortune's Scepter","Shellspire Sword","Bound Knife","Tiled Knife",
  "Venturi Knife","Iridian Thorn Blade","Artisan Foil","Genesis Arc","Hivemind Sword","Kingdom Knife",
  "K/Tac Blade","Outpost Melee","Prism III Axe","Ruin Dagger","Songsteel","Striker Knife",".Sys Melee",
  "Velocity Karambit","Task Force 809 Knife","Verdant Cafe Chef's Knife"
].map(n => simplifier(n)));

function simplifier(n) {
  return String(n).toLowerCase().replace(/ø/g, "o").normalize("NFD").replace(/[^a-z0-9]/g, "");
}
function prixCouteau(nomEn, rarete) {
  const k = simplifier(nomEn);
  if (PRIX_COUTEAUX[k]) return PRIX_COUTEAUX[k];
  if (/^champion/.test(k)) return 5350;
  return PRIX_MELEE[rarete];
}
const ARMES_PRINCIPALES = ["Vandal", "Phantom", "Operator", "Sheriff", "Ghost"];
const API = "https://valorant-api.com/v1";
const PAR_PAGE = 60;

let skins = [];
let filtre = { texte: "", arme: "Tout", rarete: "Tout", tri: "nom", affiches: PAR_PAGE };
const $ = id => document.getElementById(id);

async function charger() {
  try {
    const [w, s, t, sEn, contrats] = await Promise.all([
      fetch(API + "/weapons?language=fr-FR").then(r => r.json()),
      fetch(API + "/weapons/skins?language=fr-FR").then(r => r.json()),
      fetch(API + "/contenttiers").then(r => r.json()),
      fetch(API + "/weapons/skins?language=en-US").then(r => r.json()).catch(() => null),
      fetch(API + "/contracts").then(r => r.json()).catch(() => null)
    ]);
    const nomEn = {};
    if (sEn && sEn.data) sEn.data.forEach(x => nomEn[x.uuid] = x.displayName);
    // Tous les skins gagnés via un passe / contrat (non achetables en boutique)
    const niveauxPasse = new Set();
    (function parcourir(o) {
      if (!o || typeof o !== "object") return;
      if (Array.isArray(o)) return o.forEach(parcourir);
      if (o.type === "EquippableSkinLevel" && o.uuid) niveauxPasse.add(o.uuid);
      Object.values(o).forEach(parcourir);
    })(contrats && contrats.data);
    const tiers = {};
    t.data.forEach(x => tiers[x.uuid] = x.devName);
    const armeDuSkin = {};
    w.data.forEach(wp => wp.skins.forEach(sk => armeDuSkin[sk.uuid] = wp));

    s.data.forEach(sk => {
      const rarete = tiers[sk.contentTierUuid];
      const wp = armeDuSkin[sk.uuid];
      if (!rarete || !RARETES[rarete] || !wp) return;
      const melee = wp.category.endsWith("Melee");
      const image = sk.displayIcon
        || (sk.chromas[0] && sk.chromas[0].fullRender)
        || (sk.levels[0] && sk.levels[0].displayIcon);
      if (!image) return;
      const arme = melee ? "Mêlée" : wp.displayName;
      const nomAnglais = nomEn[sk.uuid] || sk.displayName;
      const pass = (sk.levels || []).some(l => niveauxPasse.has(l.uuid))
        || (melee && PASS_COUTEAUX.has(simplifier(nomAnglais)));
      skins.push({
        pass: pass,
        id: skins.length,
        videos: videosDuSkin(sk),
        nom: sk.displayName, arme: arme, rarete: rarete, image: image,
        groupe: melee ? "Mêlée" : (ARMES_PRINCIPALES.includes(arme) ? arme : "Autres"),
        prix: melee ? prixCouteau(nomAnglais, rarete) : RARETES[rarete].prix
      });
    });
    $("msg").style.display = "none";
    boutons();
    afficher();
  } catch (e) {
    $("msg").textContent = "Impossible de charger les skins (" + e.message + "). Vérifie ta connexion et recharge la page.";
  }
}

function boutons() {
  const groupes = ["Tout", ...ARMES_PRINCIPALES, "Mêlée", "Autres", "Passe"];
  $("armesBtns").innerHTML = groupes.map(g => {
    const n = g === "Tout" ? skins.length : g === "Passe" ? skins.filter(s => s.pass).length : skins.filter(s => s.groupe === g).length;
    return '<button class="btn" data-type="arme" data-val="' + g + '">' + (g === "Passe" ? "Skins de passe" : g) + ' <small>(' + n + ')</small></button>';
  }).join("");
  $("raretesBtns").innerHTML =
    '<button class="btn rar" data-type="rarete" data-val="Tout">Toutes</button>' +
    Object.keys(RARETES).map(k => {
      const n = skins.filter(s => s.rarete === k).length;
      return '<button class="btn rar" data-type="rarete" data-val="' + k + '" style="--c:' + RARETES[k].couleur + '">' +
        '<img src="' + RARETES[k].logo + '" alt="' + k + '" title="' + k + '"> <small>(' + n + ')</small></button>';
    }).join("");
  document.querySelectorAll(".btn[data-type]").forEach(b => {
    b.onclick = () => { filtre[b.dataset.type] = b.dataset.val; filtre.affiches = PAR_PAGE; afficher(); };
  });
}

function afficher() {
  document.querySelectorAll(".btn[data-type]").forEach(b =>
    b.classList.toggle("on", filtre[b.dataset.type] === b.dataset.val));

  const liste = skins.filter(s =>
    (filtre.arme === "Tout" || (filtre.arme === "Passe" ? s.pass : s.groupe === filtre.arme)) &&
    (filtre.rarete === "Tout" || s.rarete === filtre.rarete) &&
    (s.nom + " " + s.arme + " " + s.rarete).toLowerCase().includes(filtre.texte));

  const pAsc = x => x.pass ? 1e9 : x.prix, pDesc = x => x.pass ? -1 : x.prix;
  liste.sort((a, b) =>
    filtre.tri === "asc" ? pAsc(a) - pAsc(b) || a.nom.localeCompare(b.nom)
    : filtre.tri === "desc" ? pDesc(b) - pDesc(a) || a.nom.localeCompare(b.nom)
    : a.nom.localeCompare(b.nom));

  $("count").textContent = liste.length + " RÉSULTATS";
  $("grid").innerHTML = liste.slice(0, filtre.affiches).map(a => {
    const r = RARETES[a.rarete];
    const euros = (a.prix * 0.00999).toFixed(2).replace(".", ",");
    return '<div class="card" data-i="' + a.id + '" style="cursor:pointer;--c:' + r.couleur + ';--c-fond:' + r.couleur + '33">' +
      '<div class="img"><img class="arme-img" loading="lazy" src="' + a.image + '" alt="">' +
        '<div class="badge"><img src="' + r.logo + '" alt="' + a.rarete + '" title="' + a.rarete + '"></div></div>' +
      '<div class="name">' + a.nom + '</div>' +
      '<div class="arme">' + a.arme + '</div>' +
      '<div class="prix">' + (a.pass ? 'Skin de passe' : a.prix.toLocaleString("fr-FR") + ' VP<small>≈ ' + euros + ' €</small>') + '</div>' +
    '</div>';
  }).join("");
  $("more").hidden = liste.length <= filtre.affiches;
}

$("search").oninput = e => { filtre.texte = e.target.value.toLowerCase().trim(); filtre.affiches = PAR_PAGE; afficher(); };
$("sort").onchange = e => { filtre.tri = e.target.value; afficher(); };
$("more").onclick = () => { filtre.affiches += PAR_PAGE; afficher(); };

const TYPES_VIDEO = {
  VFX: "Effets visuels", Animation: "Animation", Finisher: "Finisher",
  Transformation: "Transformation", KillBanner: "Bannière de kill",
  KillCounter: "Compteur de kills", Topfrag: "Top frag", Heartbeat: "Battement de cœur",
  Voiceover: "Voix", SoundEffects: "Effets sonores", Inspect: "Inspection"
};
function videosDuSkin(sk) {
  const v = [];
  (sk.levels || []).forEach((l, i) => {
    if (!l.streamedVideo) return;
    const t = (l.levelItem || "").split("::").pop();
    v.push({ label: TYPES_VIDEO[t] || l.displayName || ("Niveau " + (i + 1)), src: l.streamedVideo });
  });
  (sk.chromas || []).forEach(c => {
    if (!c.streamedVideo) return;
    v.push({ label: "Variante : " + (c.displayName || "").replace(/\s*\n.*/, ""), src: c.streamedVideo });
  });
  return v;
}

function ouvrir(i) {
  const a = skins[i], r = RARETES[a.rarete];
  const euros = (a.prix * 0.00999).toFixed(2).replace(".", ",");
  const d = $("detail");
  d.style.setProperty("--c", r.couleur);
  d.style.setProperty("--c-fond", r.couleur + "33");
  $("d-hero").innerHTML = '<img class="big" src="' + a.image + '" alt="">' +
    '<div class="badge"><img src="' + r.logo + '" alt="' + a.rarete + '" title="' + a.rarete + '"></div>';
  $("d-title").textContent = a.nom;
  $("d-sub").textContent = a.arme + " · " + a.rarete;
  $("d-prix").innerHTML = a.pass ? 'Skin de passe' : a.prix.toLocaleString("fr-FR") + ' VP<small>≈ ' + euros + ' €</small>';
  const vid = $("d-video");
  if (a.videos.length) {
    $("d-novideo").hidden = true; vid.hidden = false;
    $("d-tabs").innerHTML = a.videos.map((v, k) =>
      '<button class="btn" data-v="' + k + '">' + v.label + '</button>').join("");
    document.querySelectorAll("#d-tabs .btn").forEach(b => b.onclick = () => lire(a, +b.dataset.v));
    lire(a, 0);
  } else {
    vid.pause(); vid.removeAttribute("src"); vid.hidden = true;
    $("d-tabs").innerHTML = ""; $("d-novideo").hidden = false;
  }
  d.classList.add("open"); d.scrollTop = 0;
  document.body.style.overflow = "hidden";
}
function lire(a, k) {
  document.querySelectorAll("#d-tabs .btn").forEach(b => b.classList.toggle("on", +b.dataset.v === k));
  const vid = $("d-video");
  vid.src = a.videos[k].src;
  vid.load();
  vid.play().catch(() => {});
}
function fermer() {
  const vid = $("d-video");
  vid.pause(); vid.removeAttribute("src"); vid.load();
  $("detail").classList.remove("open");
  document.body.style.overflow = "";
}
$("grid").onclick = e => { const c = e.target.closest(".card"); if (c) ouvrir(+c.dataset.i); };
$("d-close").onclick = fermer;
document.addEventListener("keydown", e => { if (e.key === "Escape") fermer(); });

charger();
</script>
