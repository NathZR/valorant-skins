<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valorant Skins</title>
<style>
:root{--bg:#07090d;--card:#0c0f15;--line:#1c212b;--txt:#e8ebf0;--mut:#7d8594;
--select:#3b82f6;--deluxe:#14a38b;--premium:#ec4899;--exclusive:#f97316;--ultra:#eab308}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.wrap{max-width:1500px;margin:0 auto;padding:28px 32px}
h1{font-size:20px;letter-spacing:.15em;margin:0 0 18px}
.box{border:1px solid var(--line);border-radius:14px;padding:16px;background:#0a0d12}
input,select{background:#0c0f15;border:1px solid var(--line);color:var(--txt);border-radius:8px;font:inherit;padding:12px 14px}
input{width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:12px 18px;font:inherit;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.btn small{color:var(--mut);font-weight:400}
.btn.on{background:#fff;color:#000}.btn.on small{color:#555}
.t-select{color:var(--select)}.t-deluxe{color:var(--deluxe)}.t-premium{color:var(--premium)}.t-exclusive{color:var(--exclusive)}.t-ultra{color:var(--ultra)}
.btn.t-select.on{box-shadow:inset 0 0 0 2px var(--select)}.btn.t-deluxe.on{box-shadow:inset 0 0 0 2px var(--deluxe)}
.btn.t-premium.on{box-shadow:inset 0 0 0 2px var(--premium)}.btn.t-exclusive.on{box-shadow:inset 0 0 0 2px var(--exclusive)}.btn.t-ultra.on{box-shadow:inset 0 0 0 2px var(--ultra)}
.btn[class*=t-].on{background:#10141b}
.bar{display:flex;justify-content:space-between;align-items:center;margin:22px 0;padding-bottom:14px;border-bottom:1px solid var(--line);color:var(--mut);letter-spacing:.15em;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.img{position:relative;height:170px;border-radius:8px;background:radial-gradient(circle at 50% 30%,#1b2538,#0d1118);display:flex;align-items:center;justify-content:center;overflow:hidden}
.img img{max-width:92%;max-height:88%;object-fit:contain}
.tag{position:absolute;top:10px;right:10px;border:1px solid currentColor;border-radius:4px;padding:4px 10px;font-size:10px;letter-spacing:.15em;background:#0008}
.name{font-weight:800;font-size:15px;margin:18px 0 6px;text-transform:uppercase}
.sub{color:var(--mut);font-size:11px}
.price{text-align:right;margin-top:14px;font-weight:800;font-size:15px}
.price small{display:block;color:var(--mut);font-weight:400;font-size:10px;margin-top:3px}
#more{display:block;margin:30px auto}
#msg{text-align:center;color:var(--mut);padding:60px}
</style>
</head>
<body>
<div class="wrap">
  <h1>VALORANT · SKINS</h1>
  <div class="box"><input id="q" type="search" placeholder="Rechercher (Reaver, Prime, Vandal, Oni…)"></div>
  <div class="row" id="weapons"></div>
  <div class="row" id="tiers"></div>
  <div class="bar"><span id="count">CHARGEMENT…</span>
    <span>TRIER · <select id="sort"><option value="name">Nom</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option></select></span></div>
  <div class="grid" id="grid"></div>
  <div id="msg">Chargement des skins…</div>
  <button class="btn" id="more" hidden>Voir plus</button>
</div>
<script>
const API = "https://valorant-api.com/v1";
const TIERS = {Select:875, Deluxe:1275, Premium:1775, Exclusive:2175, Ultra:2475};
const MELEE = {Select:1775, Deluxe:2550, Premium:3550, Exclusive:4350, Ultra:4950}; // estimations
const MAIN = ["Vandal","Phantom","Operator","Sheriff","Ghost"];
const EUR = 0.00999, PAGE = 60;
let skins = [], f = {q:"", weapon:"all", tier:"all", sort:"name", shown:PAGE};
const $ = id => document.getElementById(id);

async function init(){
  try{
    const [w, s, t] = await Promise.all([
      fetch(`${API}/weapons?language=fr-FR`).then(r=>r.json()),
      fetch(`${API}/weapons/skins?language=fr-FR`).then(r=>r.json()),
      fetch(`${API}/contenttiers`).then(r=>r.json())
    ]);
    const tierMap = {}; t.data.forEach(x => tierMap[x.uuid] = x.devName);
    const skinWeapon = {};
    w.data.forEach(wp => wp.skins.forEach(sk => skinWeapon[sk.uuid] = wp));
    s.data.forEach(sk => {
      const tier = tierMap[sk.contentTierUuid];
      const wp = skinWeapon[sk.uuid];
      if(!tier || !TIERS[tier] || !wp) return;
      const melee = wp.category.endsWith("Melee");
      const img = sk.displayIcon || (sk.chromas[0] && sk.chromas[0].fullRender) || (sk.levels[0] && sk.levels[0].displayIcon);
      if(!img) return;
      skins.push({name:sk.displayName, img, tier, weapon: melee ? "Mêlée" : wp.displayName,
        group: melee ? "Mêlée" : (MAIN.includes(wp.displayName) ? wp.displayName : "Autres"),
        vp: (melee ? MELEE : TIERS)[tier]});
    });
    $("msg").remove();
    buildFilters(); render();
  }catch(e){ $("msg").textContent = "Impossible de charger les données. Réessaie plus tard."; }
}

function buildFilters(){
  const groups = [...MAIN, "Mêlée", "Autres"];
  $("weapons").innerHTML = btn("weapon","all","Tout",skins.length) +
    groups.map(g => btn("weapon",g,g,skins.filter(s=>s.group===g).length)).join("");
  $("tiers").innerHTML = btn("tier","all","Tous") +
    Object.keys(TIERS).map(t => btn("tier",t,`${t} · ${TIERS[t]} VP`,skins.filter(s=>s.tier===t).length,"t-"+t.toLowerCase())).join("");
  document.querySelectorAll(".btn[data-k]").forEach(b => b.onclick = () => { f[b.dataset.k]=b.dataset.v; f.shown=PAGE; render(); });
}
const btn = (k,v,label,n,cls="") => `<button class="btn ${cls}" data-k="${k}" data-v="${v}">${label}${n!=null?` <small>(${n})</small>`:""}</button>`;

function render(){
  document.querySelectorAll(".btn[data-k]").forEach(b => b.classList.toggle("on", f[b.dataset.k]===b.dataset.v));
  let list = skins.filter(s =>
    (f.weapon==="all" || s.group===f.weapon) && (f.tier==="all" || s.tier===f.tier) &&
    (s.name+" "+s.weapon).toLowerCase().includes(f.q));
  list.sort((a,b) => f.sort==="asc" ? a.vp-b.vp || a.name.localeCompare(b.name)
    : f.sort==="desc" ? b.vp-a.vp || a.name.localeCompare(b.name) : a.name.localeCompare(b.name));
  $("count").textContent = `${list.length} RÉSULTATS`;
  $("grid").innerHTML = list.slice(0,f.shown).map(s => `
    <div class="card"><div class="img"><span class="tag t-${s.tier.toLowerCase()}">${s.tier.toUpperCase()}</span>
    <img loading="lazy" src="${s.img}" alt="${s.name}"></div>
    <div class="name">${s.name}</div><div class="sub">${s.weapon}</div>
    <div class="price">${s.vp.toLocaleString("fr-FR")} VP<small>≈ ${(s.vp*EUR).toFixed(2).replace(".",",")} €</small></div></div>`).join("");
  $("more").hidden = list.length <= f.shown;
}
$("q").oninput = e => { f.q = e.target.value.toLowerCase().trim(); f.shown=PAGE; render(); };
$("sort").onchange = e => { f.sort = e.target.value; render(); };
$("more").onclick = () => { f.shown += PAGE; render(); };
init();
</script>
</body>
</html>
